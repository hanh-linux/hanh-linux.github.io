    function gradeQuiz() {
        let score = 0;
        
        questions.forEach((q, idx) => {
            const selected = document.querySelector(`input[name="q${idx}"]:checked`);
            const explainDiv = document.getElementById(`expl-${idx}`);
            const card = document.getElementById(`card-${idx}`);

            explainDiv.style.display = 'block'; // Hiện giải thích
            
            // Xóa style cũ
            card.querySelectorAll('label').forEach(l => {
                l.classList.remove('ans-correct', 'ans-wrong');
            });

            // Highlight đáp án đúng
            const correctLabel = document.getElementById(`lbl-${idx}-${q.ans}`);
            if(correctLabel) correctLabel.classList.add('ans-correct');

            if (selected) {
                const val = parseInt(selected.value);
                if (val === q.ans) {
                    score++;
                } else {
                    const wrongLabel = document.getElementById(`lbl-${idx}-${val}`);
                    if(wrongLabel) wrongLabel.classList.add('ans-wrong');
                }
            }
        });

        const scorePanel = document.getElementById('score-panel');
        scorePanel.style.display = 'block';
        scorePanel.innerText = `KẾT QUẢ: ${score} / ${questions.length} CÂU ĐÚNG`;
        scorePanel.scrollIntoView({ behavior: 'smooth' });

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = "ĐÃ CHẤM ĐIỂM";
        btn.style.background = "#95a5a6";
    }

    // Render questions
    window.onload = function() {
        const container = document.getElementById('quiz-body');
        let html = '';

        questions.forEach((q, idx) => {
            let lvlClass = q.level === 'easy' ? 'lvl-easy' : (q.level === 'medium' ? 'lvl-medium' : 'lvl-hard');
            let lvlText = q.level === 'easy' ? 'DỄ' : (q.level === 'medium' ? 'TRUNG BÌNH' : 'KHÓ');

            html += `
                <div class="question-card ${lvlClass}" id="card-${idx}">
                    <div class="q-meta">
                        <span>Câu ${idx + 1}: ${q.type}</span>
                        <span style="color:${q.level === 'hard' ? '#c0392b' : '#27ae60'}">${lvlText}</span>
                    </div>
                    
                    <div class="q-text">${q.q}</div>
                    
                    <pre>${q.code.replace(/</g, "&lt;")}</pre>
                    
                    <div class="options">
                        ${q.opts.map((opt, i) => `
                            <label id="lbl-${idx}-${i}">
                                <input type="radio" name="q${idx}" value="${i}">
                                ${opt.replace(/</g, "&lt;")}
                            </label>
                        `).join('')}
                    </div>

                    <div class="explain-area" id="expl-${idx}">
                        <strong>Giải thích:</strong> ${q.expl}
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    };
</script>
