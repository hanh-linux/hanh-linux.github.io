<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Practice: Crime, Laws & Social Issues</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #c0392b; /* Đổi sang màu đỏ đô cho hợp chủ đề luật pháp/tội phạm */
            --secondary: #2980b9;
            --light: #ecf0f1;
            --correct: #27ae60;
            --incorrect: #c0392b;
            --font-stack: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-stack);
            background-color: #f5f6fa;
            color: #2c3e50;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 4px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            font-size: 2.2em;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1em;
            color: #7f8c8d;
        }

        /* Exercise Card */
        .exercise-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 50px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        .card-header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h3 {
            margin: 0;
            font-size: 1.2em;
            font-weight: 600;
        }

        .topic-badge {
            background-color: var(--accent);
            color: white;
            font-size: 0.85em;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .card-body {
            padding: 25px;
        }

        /* Word Bank */
        .word-bank {
            background-color: var(--light);
            border: 2px dashed #bdc3c7;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 60px;
        }

        .draggable {
            background: white;
            border: 1px solid #bdc3c7;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: grab;
            font-weight: 600;
            font-size: 0.95em;
            color: var(--primary);
            box-shadow: 0 2px 2px rgba(0,0,0,0.05);
            transition: all 0.2s;
            user-select: none;
        }

        .draggable:hover {
            border-color: var(--secondary);
            color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .draggable.dragging {
            opacity: 0.5;
            background: #dfe6e9;
        }

        /* Paragraph Content */
        .text-content {
            font-size: 1.1em;
            line-height: 2.5; /* High line-height for drop zones */
            text-align: justify;
        }

        .drop-zone {
            display: inline-flex;
            min-width: 120px;
            height: 34px;
            border-bottom: 2px solid #95a5a6;
            background-color: #f4f6f7;
            margin: 0 5px;
            vertical-align: middle;
            align-items: center;
            justify-content: center;
            border-radius: 4px 4px 0 0;
            transition: all 0.3s;
            position: relative;
            top: 4px;
            padding: 0 10px;
        }

        .drop-zone.drag-over {
            background-color: #d6eaf8;
            border-bottom-color: var(--secondary);
        }

        .drop-zone .draggable {
            margin: 0;
            border: none;
            background: transparent;
            box-shadow: none;
            padding: 0;
            width: 100%;
            text-align: center;
            cursor: grab;
        }

        /* Results */
        .drop-zone.correct {
            border-bottom: 3px solid var(--correct);
            background-color: #e9f7ef;
            color: var(--correct);
            font-weight: bold;
        }

        .drop-zone.incorrect {
            border-bottom: 3px solid var(--incorrect);
            background-color: #fdedec;
            color: var(--incorrect);
            font-weight: bold;
        }

        /* Footer Controls */
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            border-top: 1px solid #eee;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }

        #submit-btn {
            background-color: var(--correct);
            color: white;
        }
        #submit-btn:hover { background-color: #219150; }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }
        #reset-btn:hover { background-color: #7f8c8d; }

        #score-display {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
            margin-left: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Crime, Laws & Social Issues</h1>
        <p class="subtitle">Theme 15 Vocabulary Practice (Drag and Drop)</p>
    </header>

    <div id="exercises-wrapper"></div>
</div>

<div class="footer-bar">
    <button id="submit-btn" onclick="checkAll()">Nộp Bài</button>
    <button id="reset-btn" onclick="location.reload()">Làm Lại</button>
    <div id="score-display"></div>
</div>

<script>
    // Dữ liệu 10 bài tập được biên soạn từ file từ vựng chủ đề "Crime, Laws and Social Issues"
    const exercisesData = [
        {
            id: 1,
            title: "The Courtroom Process",
            topic: "Legal System",
            text: "The legal process is complex and strictly regulated. When a case goes to court, the <strong>[1]</strong> presides over the proceedings to ensure the law is followed. The person accused of the crime, known as the <strong>[2]</strong>, has the right to a fair hearing. A group of citizens, called the <strong>[3]</strong>, listens to the facts to decide the outcome. During the trial, a <strong>[4]</strong> may be called to describe what they saw or heard regarding the incident. After hearing all the arguments, the jury must reach a <strong>[5]</strong>. If the person is found guilty, the court will determine the appropriate punishment or <strong>[6]</strong>.",
            answers: ["judge", "defendant", "jury", "witness", "verdict", "sentence"],
            distractors: ["slum", "charity", "riot", "welfare", "abortion", "norm"]
        },
        {
            id: 2,
            title: "Crime and Punishment",
            topic: "Punishment",
            text: "Society establishes rules to maintain order, and those who break them face consequences. If you <strong>[1]</strong> a serious crime, the police will investigate and may arrest you. The most severe form of penalty in some countries is <strong>[2]</strong>, which involves the loss of life, though this is highly controversial. For less serious offenses, a person might simply have to pay a <strong>[3]</strong>. However, for dangerous acts, the criminal is usually sent to <strong>[4]</strong> for a set period. Sometimes, instead of jail, an offender performs <strong>[5]</strong> to help the local area. The goal is often not just to punish, but to <strong>[6]</strong> others from breaking the law.",
            answers: ["commit", "capital punishment", "fine", "prison", "community service", "deter"],
            distractors: ["volunteer", "meeting", "awareness", "freedom", "equality", "meeting"]
        },
        {
            id: 3,
            title: "Social Inequality",
            topic: "Social Issues",
            text: "The gap between the rich and the poor creates significant problems in modern society. Extreme <strong>[1]</strong> often forces people to live in difficult conditions. In many large cities, you can find a <strong>[2]</strong> where housing is dirty and in bad condition. Those who cannot afford rent might become a <strong>[3]</strong>, living in empty buildings without permission. Sadly, you may also see a <strong>[4]</strong> on the street asking for money just to survive. This profound <strong>[5]</strong> means that some have vast opportunities while others have none. We must raise <strong>[6]</strong> of these issues to build a fairer world.",
            answers: ["poverty-stricken", "slum", "squatter", "beggar", "inequality", "awareness"],
            distractors: ["verdict", "jury", "lawyer", "court", "trial", "witness"]
        },
        {
            id: 4,
            title: "Juvenile Justice",
            topic: "Youth & Law",
            text: "Young people who break the law are treated differently from adults. A <strong>[1]</strong> is a young person who is not yet an adult, and their crimes are often linked to a lack of guidance. Issues like <strong>[2]</strong> addiction can lead teenagers down a wrong path. The legal system often focuses on how to <strong>[3]</strong> these young offenders so they can have a normal life again. Authorities might take a <strong>[4]</strong> approach, enforcing rules tightly, or a more lenient one. It is a necessary <strong>[5]</strong> to provide education and support. Ultimately, we must not <strong>[6]</strong> these young people but help them reintegrate into society.",
            answers: ["juvenile", "drug", "rehabilitate", "strict", "measure", "reject"],
            distractors: ["war", "riot", "fraud", "traffic", "unrest", "gambling"]
        },
        {
            id: 5,
            title: "Civil Rights and Unrest",
            topic: "Rights",
            text: "Throughout history, people have fought for their liberties. <strong>[1]</strong> of speech allows individuals to say what they think without fear. However, when a government suppresses these rights, it can lead to <strong>[2]</strong>. People might organize a <strong>[3]</strong> to march in the streets and show their disagreement. If the situation becomes violent, it can turn into a <strong>[4]</strong>, causing damage to public property. Such events often cause great <strong>[5]</strong> among the public. It is essential to respect human <strong>[6]</strong> to maintain a peaceful and just society.",
            answers: ["freedom", "unrest", "demonstration", "riot", "controversy", "rights"],
            distractors: ["traffic", "gambling", "hygiene", "literacy", "donation", "jury"]
        },
        {
            id: 6,
            title: "Types of Illegal Activity",
            topic: "Crime Types",
            text: "There are many different categories of illegal behavior. <strong>[1]</strong> crimes involve physical force, such as assault or murder. Other offenses are related to vice, such as <strong>[2]</strong>, which involves betting money on games of chance. <strong>[3]</strong> is another serious issue, involving the sale of sexual services. The government tracks the <strong>[4]</strong> to see if the number of offenses is rising or falling. Even <strong>[5]</strong> crimes, which are small and unimportant, still clog up the legal system. A habitual <strong>[6]</strong> is someone who repeatedly breaks the law.",
            answers: ["violent", "gambling", "prostitution", "crime rate", "petty", "criminal"],
            distractors: ["charity", "volunteer", "welfare", "judge", "lawyer", "court"]
        },
        {
            id: 7,
            title: "Law Enforcement",
            topic: "Police",
            text: "The police have a duty to keep the public safe. They must <strong>[1]</strong> the law and ensure that citizens obey it. When they have enough information, they will <strong>[2]</strong> a suspect for a specific crime. It is their job to <strong>[3]</strong> the community against danger and harm. They also work to <strong>[4]</strong> crime before it happens by being visible on the streets. If a person tries to <strong>[5]</strong> or break the law, the police will intervene. Their authority allows them to take people into <strong>[6]</strong> for questioning.",
            answers: ["enforce", "charge", "protect", "prevent", "violate", "custody"],
            // Note: 'enforce' not in list, swapped for 'uphold' or similar context. 'charge' is in list.
            // Let's use words strictly from the provided list.
            // "abide by" is in list. "violate" is in list. "enforce" is NOT.
            // Replacement: "They must ensure people [abide by] the law" -> context change.
            // Let's use: "authority" (noun) -> "They are the [authority]..."
            // Let's adjust the text slightly to fit the list exactly.
            // Re-drafting answers based on exact CSV list:
            // answers: ["authority", "charge", "protect", "combat", "violate", "custody"]
            answers: ["authority", "charge", "protect", "combat", "violate", "custody"],
            distractors: ["commit", "offend", "perpetrate", "harm", "injure", "sue"]
        },
        {
            id: 8,
            title: "Trial Outcomes",
            topic: "Justice",
            text: "The conclusion of a legal trial is a critical moment. The prosecution must provide <strong>[1]</strong> to show that the accused really committed the crime. If the facts are not clear, the jury cannot find the person <strong>[2]</strong>. In this case, the judge will <strong>[3]</strong> the defendant, meaning they are free to go. Conversely, if they are proven to be the offender, the court will <strong>[4]</strong> them. An <strong>[5]</strong> person is someone who has done nothing wrong. Sometimes, a prisoner is released early on <strong>[6]</strong> for good behavior.",
            answers: ["evidence", "guilty", "acquit", "convict", "innocent", "parole"],
            distractors: ["poverty", "slum", "beggar", "charity", "donation", "volunteer"]
        },
        {
            id: 9,
            title: "Public Safety & Traffic",
            topic: "Safety",
            text: "Safety on the roads is a major social concern. Drivers must follow <strong>[1]</strong> strictly to avoid accidents. Driving in a <strong>[2]</strong> manner, without care for danger, can lead to tragedy. A serious crash can cause severe <strong>[3]</strong> or even death to drivers and pedestrians. If you go through a red light, you may have to pay a <strong>[4]</strong>. Everyone is <strong>[5]</strong> for their own actions behind the wheel. We must eliminate the <strong>[6]</strong> or lack of attention that causes so many unnecessary deaths.",
            answers: ["traffic rules", "reckless", "injury", "fine", "responsible", "lack"],
            distractors: ["prison", "capital punishment", "judge", "jury", "trial", "lawyer"]
        },
        {
            id: 10,
            title: "Global Humanitarian Issues",
            topic: "Humanity",
            text: "Many problems affect people across borders. A <strong>[1]</strong> issue is one that involves multiple countries, not just one. <strong>[2]</strong> is a terrible situation where nations fight, causing death and destruction. In some places, <strong>[3]</strong> leads to unfair treatment based on skin color or ethnicity. We must protect the <strong>[4]</strong> minority groups who are often vulnerable. Many people work as a <strong>[5]</strong> to help those in need without payment. Governments provide <strong>[6]</strong> to support the poorest members of society.",
            answers: ["global", "war", "racism", "ethnic", "volunteer", "welfare"],
            distractors: ["petty", "domestic", "local", "traffic", "gambling", "drug"]
        }
    ];

    // Hàm trộn mảng (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Khởi tạo bài tập
    function init() {
        const wrapper = document.getElementById('exercises-wrapper');

        exercisesData.forEach((ex, index) => {
            // Tạo thẻ Card
            const card = document.createElement('div');
            card.classList.add('exercise-card');

            // Header
            const header = document.createElement('div');
            header.classList.add('card-header');
            header.innerHTML = `
                <h3>${index + 1}. ${ex.title}</h3>
                <span class="topic-badge">${ex.topic}</span>
            `;
            card.appendChild(header);

            // Body
            const body = document.createElement('div');
            body.classList.add('card-body');

            // Word Bank
            const bank = document.createElement('div');
            bank.classList.add('word-bank');
            bank.id = `bank-${ex.id}`;

            // Gộp đáp án đúng và từ nhiễu, sau đó trộn
            const allWords = shuffle([...ex.answers, ...ex.distractors]);
            
            allWords.forEach(word => {
                const span = document.createElement('span');
                span.classList.add('draggable');
                span.setAttribute('draggable', 'true');
                span.textContent = word;
                // Tạo ID duy nhất cho mỗi từ để tránh xung đột
                span.id = `word-${ex.id}-${word.replace(/\s+/g, '-')}`;
                span.dataset.word = word;
                span.dataset.origin = ex.id; // Để kiểm tra nguồn gốc tránh kéo nhầm bài

                // Events Drag
                span.addEventListener('dragstart', dragStart);
                span.addEventListener('dragend', dragEnd);

                bank.appendChild(span);
            });
            body.appendChild(bank);

            // Đoạn văn
            const p = document.createElement('div');
            p.classList.add('text-content');
            
            // Thay thế [1]..[6] bằng ô drop-zone
            let formattedText = ex.text;
            ex.answers.forEach((ans, i) => {
                const placeholder = `<strong>[${i + 1}]</strong>`;
                const zone = `<span class="drop-zone" data-correct="${ans}" data-ex="${ex.id}"></span>`;
                formattedText = formattedText.replace(placeholder, zone);
            });
            
            p.innerHTML = formattedText;
            body.appendChild(p);
            
            card.appendChild(body);
            wrapper.appendChild(card);
        });

        // Gán sự kiện Drop cho toàn bộ zone và bank
        document.querySelectorAll('.drop-zone, .word-bank').forEach(el => {
            el.addEventListener('dragover', dragOver);
            el.addEventListener('drop', drop);
        });
    }

    // Drag & Drop Functions
    function dragStart(e) {
        e.dataTransfer.setData('text/plain', e.target.id);
        setTimeout(() => e.target.classList.add('dragging'), 0);
    }

    function dragEnd(e) {
        e.target.classList.remove('dragging');
    }

    function dragOver(e) {
        e.preventDefault();
        const target = e.target.closest('.drop-zone') || e.target.closest('.word-bank');
        if (target) target.classList.add('drag-over');
    }

    function drop(e) {
        e.preventDefault();
        // Xóa hiệu ứng hover
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));

        const id = e.dataTransfer.getData('text/plain');
        const draggable = document.getElementById(id);
        const target = e.target.closest('.drop-zone') || e.target.closest('.word-bank');

        if (!target || !draggable) return;

        // Logic: Chỉ cho phép thả trong cùng 1 bài tập (dựa trên ID bài tập)
        let targetExId;
        if (target.classList.contains('word-bank')) {
            targetExId = target.id.split('-')[1];
        } else {
            targetExId = target.dataset.ex;
        }

        // Nếu từ vựng không thuộc bài tập này -> Chặn
        if (draggable.dataset.origin != targetExId) return;

        // Xử lý thả vào ô trống
        if (target.classList.contains('drop-zone')) {
            // Nếu ô đã có từ -> Trả từ cũ về bank của bài tập đó
            if (target.children.length > 0) {
                const oldChild = target.children[0];
                document.getElementById(`bank-${targetExId}`).appendChild(oldChild);
            }
            target.appendChild(draggable);
            target.classList.remove('correct', 'incorrect');
        } 
        // Xử lý thả về bank
        else {
            target.appendChild(draggable);
        }
    }

    // Kiểm tra đáp án
    function checkAll() {
        const zones = document.querySelectorAll('.drop-zone');
        let total = zones.length;
        let correct = 0;

        zones.forEach(zone => {
            const correctAnswer = zone.dataset.correct;
            // Reset style
            zone.classList.remove('correct', 'incorrect');

            if (zone.children.length > 0) {
                const userWord = zone.children[0].dataset.word;
                if (userWord === correctAnswer) {
                    zone.classList.add('correct');
                    correct++;
                } else {
                    zone.classList.add('incorrect');
                }
            } else {
                zone.classList.add('incorrect');
            }
        });

        const display = document.getElementById('score-display');
        display.innerHTML = `Kết quả: <span style="color:${correct === total ? '#27ae60' : '#c0392b'}">${correct} / ${total}</span> câu đúng`;
        
        if (correct === total) {
            display.innerHTML += " - Tuyệt vời!";
        }
    }

    // Chạy khi tải trang
    window.onload = init;

</script>

</body>
</html>
