    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        let html = '';
        
        questions.forEach((q, idx) => {
            let badgeClass = q.level === 'easy' ? 'badge-easy' : (q.level === 'medium' ? 'badge-medium' : 'badge-hard');
            let levelText = q.level === 'easy' ? 'DỄ' : (q.level === 'medium' ? 'TB' : 'KHÓ');
            
            html += `
                <div class="question-card level-${q.level}" id="card-${idx}">
                    <div class="question-title">
                        <span>Câu ${q.id}: ${q.type}</span>
                        <span class="badge ${badgeClass}">${levelText}</span>
                    </div>
                    <div>${q.q}</div>
                    <pre>${q.code.replace(/</g, "&lt;")}</pre>
                    <div class="options">
                        ${q.opts.map((opt, i) => `
                            <label id="lbl-${idx}-${i}">
                                <input type="radio" name="q${idx}" value="${i}"> ${opt.replace(/</g, "&lt;")}
                            </label>
                        `).join('')}
                    </div>
                    <div class="result-box" id="res-${idx}">
                        <strong>Giải thích:</strong> ${q.expl}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function checkAnswers() {
        let score = 0;
        
        questions.forEach((q, idx) => {
            const selected = document.querySelector(`input[name="q${idx}"]:checked`);
            const resBox = document.getElementById(`res-${idx}`);
            resBox.style.display = 'block';

            // Reset màu cũ
            for(let i=0; i<4; i++) {
                const lbl = document.getElementById(`lbl-${idx}-${i}`);
                if(lbl) lbl.classList.remove('correct-bg', 'wrong-bg');
            }

            // Tô màu đáp án đúng
            const correctLbl = document.getElementById(`lbl-${idx}-${q.ans}`);
            if(correctLbl) correctLbl.classList.add('correct-bg');

            if (selected) {
                const val = parseInt(selected.value);
                if (val === q.ans) {
                    score++;
                } else {
                    // Tô màu đáp án sai người dùng chọn
                    const wrongLbl = document.getElementById(`lbl-${idx}-${val}`);
                    if(wrongLbl) wrongLbl.classList.add('wrong-bg');
                }
            }
        });

        // Hiển thị điểm
        const scoreBoard = document.getElementById('score-board');
        scoreBoard.style.display = 'block';
        scoreBoard.innerText = `KẾT QUẢ: ${score} / ${questions.length} CÂU ĐÚNG`;
        
        // Scroll lên đầu để xem điểm
        scoreBoard.scrollIntoView({ behavior: 'smooth' });

        // Disable nút nộp
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = "ĐÃ CHẤM ĐIỂM XONG";
        btn.style.background = "#666";
    }

    // Khởi chạy khi load trang
    renderQuiz();
</script>
