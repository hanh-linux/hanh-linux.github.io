<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Practice: Lifestyle & Urbanization</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e67e22;
            --accent: #3498db;
            --light-bg: #fdfefe;
            --bank-bg: #eaeded;
            --correct: #27ae60;
            --wrong: #c0392b;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: #f2f4f4;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding-bottom: 80px; /* Space for the sticky footer */
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            font-size: 2.2em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .instructions {
            color: #555;
            font-size: 1.1em;
            font-style: italic;
        }

        /* Exercise Card Styles */
        .exercise-card {
            background: var(--light-bg);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 40px;
            border: 1px solid #d5dbdb;
            overflow: hidden;
        }

        .card-header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h3 {
            margin: 0;
            font-size: 1.3em;
        }

        .card-body {
            padding: 25px;
        }

        /* Word Bank Styles */
        .word-bank {
            background-color: var(--bank-bg);
            border: 2px dashed #95a5a6;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 60px;
        }

        .draggable {
            background: white;
            border: 1px solid #bdc3c7;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: grab;
            font-weight: 600;
            color: var(--primary);
            box-shadow: 0 2px 2px rgba(0,0,0,0.05);
            transition: all 0.2s;
            user-select: none;
        }

        .draggable:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .draggable.dragging {
            opacity: 0.5;
            background: #dfe6e9;
        }

        /* Passage and Drop Zone Styles */
        .passage {
            font-size: 1.15em;
            line-height: 2.3;
            text-align: justify;
        }

        .drop-zone {
            display: inline-flex;
            width: 150px;
            height: 34px;
            border-bottom: 2px solid #7f8c8d;
            background-color: #f4f6f7;
            margin: 0 5px;
            vertical-align: middle;
            align-items: center;
            justify-content: center;
            border-radius: 4px 4px 0 0;
            transition: all 0.3s;
            position: relative;
            top: 4px;
        }

        .drop-zone.drag-over {
            background-color: #d6eaf8;
            border-bottom-color: var(--accent);
        }

        /* Styles for words placed inside drop zones */
        .drop-zone .draggable {
            margin: 0;
            border: none;
            background: transparent;
            box-shadow: none;
            padding: 0;
            width: 100%;
            text-align: center;
            cursor: grab;
        }

        /* Grading Styles */
        .drop-zone.correct {
            border-bottom: 3px solid var(--correct);
            background-color: #e9f7ef;
            color: var(--correct);
            font-weight: bold;
        }

        .drop-zone.incorrect {
            border-bottom: 3px solid var(--wrong);
            background-color: #fdedec;
            color: var(--wrong);
            font-weight: bold;
        }

        /* Floating Footer Panel */
        .footer-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            border-top: 1px solid #ddd;
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }

        #submit-btn {
            background-color: var(--secondary);
            color: white;
        }
        #submit-btn:hover { background-color: #d35400; }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }
        #reset-btn:hover { background-color: #7f8c8d; }

        #score-display {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
            margin-left: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Lifestyle and Urbanization</h1>
        <p class="instructions">Kéo các từ trong khung (Word Bank) và thả vào ô trống thích hợp. Nhấn "NỘP BÀI" để kiểm tra kết quả.</p>
    </header>

    <div id="exercises-wrapper">
        </div>
</div>

<div class="footer-panel">
    <button id="submit-btn" onclick="checkAllAnswers()">Nộp Bài (Submit)</button>
    <button id="reset-btn" onclick="location.reload()">Làm Lại (Reset)</button>
    <div id="score-display"></div>
</div>

<script>
    // Data for the 10 exercises, strictly using vocabulary from the provided list.
    const exerciseData = [
        {
            id: 1,
            title: "Topic 1: The Lure of the City",
            text: "The rapid process of <strong>[1]</strong> has transformed the global landscape. Millions of <strong>[2]</strong> move to cities each year seeking a better <strong>[3]</strong>. However, this sudden influx creates a massive strain on urban <strong>[4]</strong>, leading to shortages in water, power, and transport. As the city expands, finding decent and affordable <strong>[5]</strong> becomes a major issue. Unfortunately, many newcomers end up living in a dangerous <strong>[6]</strong> on the outskirts of the city, where living conditions are extremely poor.",
            answers: ["urbanisation", "migrants", "standard of living", "infrastructure", "accommodation", "slum"],
            distractors: ["celebrity", "sedentary", "eccentric", "charity", "nomadic", "recreational"]
        },
        {
            id: 2,
            title: "Topic 2: Escaping the Daily Grind",
            text: "For many young professionals, life in the city feels like an endless <strong>[1]</strong>. They are constantly competing for promotions and higher salaries. Being severely <strong>[2]</strong>, they rarely have time for their families. The immense <strong>[3]</strong> to succeed can lead to mental health issues. The fast <strong>[4]</strong> leaves little room for relaxation. To improve their overall <strong>[5]</strong>, experts suggest moving away from this <strong>[6]</strong> environment and adopting a simpler, calmer way of living.",
            answers: ["rat race", "overworked", "pressure", "pace of life", "well-being", "stressful"],
            distractors: ["short-sighted", "ostentatious", "housing", "sanitation", "resident", "volunteer"]
        },
        {
            id: 3,
            title: "Topic 3: Modern Lifestyles & Health",
            text: "The modern <strong>[1]</strong> has changed dramatically over the last few decades. With the rise of office jobs and technology, people have adopted a highly <strong>[2]</strong> routine, spending hours sitting in front of screens. During their <strong>[3]</strong> time, they often prefer watching TV rather than doing physical exercises. Engaging in <strong>[4]</strong> activities, such as sports or hiking, is essential for maintaining a strong body. A <strong>[5]</strong> diet combined with an <strong>[6]</strong> lifestyle can prevent many chronic diseases associated with city living.",
            answers: ["lifestyle", "sedentary", "leisure", "recreational", "healthy", "active"],
            distractors: ["isolated", "sanitation", "sacrifice", "boom", "affluent", "overpopulated"]
        },
        {
            id: 4,
            title: "Topic 4: Materialism and Values",
            text: "In highly developed societies, the culture of <strong>[1]</strong> encourages people to buy things they don't really need. This <strong>[2]</strong> mindset measures success by the number of possessions one owns. People with great <strong>[3]</strong> work tirelessly to become <strong>[4]</strong>. They often show off their wealth through <strong>[5]</strong> displays, such as buying luxury cars and designer clothes. To find true happiness, we must rethink our <strong>[6]</strong> and focus on spiritual growth rather than the accumulation of goods.",
            answers: ["consumerism", "materialistic", "ambition", "affluent", "ostentatious", "priority"],
            distractors: ["sanitation", "rural", "slum", "charity", "volunteer", "obscurity"]
        },
        {
            id: 5,
            title: "Topic 5: The Cost of Stardom",
            text: "Many young people dream of becoming a <strong>[1]</strong>. They believe that being in the media <strong>[2]</strong> will bring them endless happiness. However, instant <strong>[3]</strong> comes with a heavy price. The loss of privacy often leads to deep <strong>[4]</strong>, as they cannot even walk down the street without being photographed. In the end, they must <strong>[5]</strong> their personal freedom for success. Some eventually become entirely <strong>[6]</strong>, hiding away in guarded mansions to avoid the public eye.",
            answers: ["celebrity", "spotlight", "fame", "isolation", "sacrifice", "reclusive"],
            distractors: ["urban", "traffic", "infrastructure", "overpopulation", "living expenses", "shelter"]
        },
        {
            id: 6,
            title: "Topic 6: A Multicultural Environment",
            text: "When you move to a large city, you must <strong>[1]</strong> to a completely new environment. A <strong>[2]</strong> city contains people from all over the world. The local <strong>[3]</strong> often speak multiple languages and celebrate different traditions. This diversity requires a high level of <strong>[4]</strong> and understanding from everyone. Living here gives you a deep <strong>[5]</strong> into other cultures. Eventually, the city becomes a true <strong>[6]</strong>, where different cultures mix together harmoniously.",
            answers: ["adapt", "cosmopolitan", "residents", "tolerance", "insight", "melting pot"],
            distractors: ["rural", "nomadic", "problematic", "downhill", "unbearable", "oblivion"]
        },
        {
            id: 7,
            title: "Topic 7: Poverty and Crisis",
            text: "One of the most pressing issues in modern cities is <strong>[1]</strong>. When a city grows too quickly without proper planning, it faces the problem of <strong>[2]</strong>. Thousands of citizens live in extreme <strong>[3]</strong> without access to basic services. Poor <strong>[4]</strong> leads to the rapid spread of diseases. Many homeless people lack basic <strong>[5]</strong> to protect themselves from the rain and cold. If governments do not intervene, the situation for these <strong>[6]</strong> will become catastrophic.",
            answers: ["overpopulation", "problematic", "poverty", "sanitation", "shelter", "dweller"], 
            // Note: Adjusted "problematic" (adj) to fit context, or use standard words. 
            // Better fit: "problem of overpopulation", "One of the most pressing issues... is poverty".
            // Rewritten for exact fit: "...issues is overpopulation. [...] faces extreme poverty. Poor sanitation... basic shelter... these dwellers will face a catastrophic situation."
            // Let's ensure proper blanks. 
            // 1: overpopulation, 2: poverty, 3: sanitation, 4: shelter, 5: dwellers, 6: catastrophic.
            // Text: "...issues is [1]. [...] live in extreme [2]. Poor [3] leads to... lack basic [4]... for these [5] will become [6]."
            // Distractors: glamorous, spotlight, leisure, consumerism, fame, eccentric
            distractors: ["glamorous", "spotlight", "leisure", "consumerism", "fame", "eccentric"]
        },
        {
            id: 8,
            title: "Topic 8: Finding Work-Life Harmony",
            text: "Maintaining a good <strong>[1]</strong> between work and personal life is essential. A <strong>[2]</strong> career makes you feel satisfied, but it shouldn't consume all your time. Sometimes, you need to make a <strong>[3]</strong> with your employer regarding your working hours. People need time for hobbies and <strong>[4]</strong> to express their true feelings. Focusing only on money can harm your mental <strong>[5]</strong>. Having a positive <strong>[6]</strong> on life helps you overcome daily challenges without stress.",
            answers: ["balance", "fulfilling", "compromise", "self-expression", "well-being", "outlook"],
            distractors: ["traffic", "infrastructure", "crowded", "dysfunctional", "overpriced", "nomadic"]
        },
        {
            id: 9,
            title: "Topic 9: The Spirit of Giving",
            text: "Many people find that participating in <strong>[1]</strong> work brings them immense joy. They willingly <strong>[2]</strong> their free time to help the poor and disabled. When disasters strike, citizens <strong>[3]</strong> money and clothes to aid victims. Wealthy individuals also <strong>[4]</strong> a large portion of their income to build schools and hospitals. This <strong>[5]</strong> behavior improves community relationships. It proves that the human <strong>[6]</strong> is not entirely consumed by greed and individualism.",
            answers: ["charity", "volunteer", "donate", "contribute", "selfless", "personality"],
            distractors: ["selfish", "ostentatious", "rat race", "isolation", "cost of living", "obscurity"]
        },
        {
            id: 10,
            title: "Topic 10: Urban Planning and The Future",
            text: "Daily <strong>[1]</strong> congestion is a major headache for urban commuters. Governments need to <strong>[2]</strong> the number of private cars on the road to reduce pollution. Planners must focus on <strong>[3]</strong> solutions rather than quick fixes. Being <strong>[4]</strong> and ignoring environmental concerns will ruin the city's future. Investing in public transport and green spaces is necessary. A high <strong>[5]</strong> should not come at the expense of clean air. Only then can cities continue to <strong>[6]</strong> sustainably.",
            answers: ["traffic", "regulate", "long-term", "short-sighted", "standard of living", "flourish"],
            distractors: ["celebrity", "melting pot", "sedentary", "reclusive", "boom", "nomadic"]
        }
    ];

    // Array Shuffler (Fisher-Yates)
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // Initialize the exercises
    function init() {
        const wrapper = document.getElementById('exercises-wrapper');

        // Render Topic 7 accurately (special handling for the drafted text)
        exerciseData[6].text = "One of the most pressing issues in modern cities is <strong>[1]</strong>. When a city grows too quickly without proper planning, thousands of citizens are forced to live in extreme <strong>[2]</strong>. Poor <strong>[3]</strong> and lack of clean water lead to the rapid spread of diseases. Many homeless people lack basic <strong>[4]</strong> to protect themselves from the weather. If governments do not intervene, the situation for these city <strong>[5]</strong> will become absolutely <strong>[6]</strong>.";

        exerciseData.forEach((ex, index) => {
            // Create Card Container
            const card = document.createElement('div');
            card.classList.add('exercise-card');

            // Card Header
            const header = document.createElement('div');
            header.classList.add('card-header');
            header.innerHTML = `<h3>${ex.title}</h3>`;
            card.appendChild(header);

            // Card Body
            const body = document.createElement('div');
            body.classList.add('card-body');

            // Word Bank
            const bank = document.createElement('div');
            bank.classList.add('word-bank');
            bank.id = `bank-${ex.id}`;

            // Combine answers and distractors, then shuffle
            const allWords = shuffle([...ex.answers, ...ex.distractors]);
            
            allWords.forEach(word => {
                const item = document.createElement('span');
                item.classList.add('draggable');
                item.setAttribute('draggable', 'true');
                item.textContent = word;
                item.id = `word-${ex.id}-${word.replace(/\s+/g, '-')}`;
                item.dataset.val = word;
                item.dataset.origin = ex.id; // To prevent cross-exercise dropping

                // Drag Events
                item.addEventListener('dragstart', dragStart);
                item.addEventListener('dragend', dragEnd);

                bank.appendChild(item);
            });
            body.appendChild(bank);

            // Passage
            const p = document.createElement('div');
            p.classList.add('passage');
            
            // Replace [1], [2]... with Drop Zones
            let formattedText = ex.text;
            ex.answers.forEach((ans, i) => {
                const placeholder = `<strong>[${i + 1}]</strong>`;
                const zone = `<span class="drop-zone" data-correct="${ans}" data-ex="${ex.id}"></span>`;
                formattedText = formattedText.replace(placeholder, zone);
            });
            
            p.innerHTML = formattedText;
            body.appendChild(p);
            
            card.appendChild(body);
            wrapper.appendChild(card);
        });

        // Add Drop Event Listeners to all zones and banks
        document.querySelectorAll('.drop-zone, .word-bank').forEach(el => {
            el.addEventListener('dragover', dragOver);
            el.addEventListener('drop', drop);
        });
    }

    // Drag & Drop Functions
    function dragStart(e) {
        e.dataTransfer.setData('text/plain', e.target.id);
        setTimeout(() => e.target.classList.add('dragging'), 0);
    }

    function dragEnd(e) {
        e.target.classList.remove('dragging');
    }

    function dragOver(e) {
        e.preventDefault();
        const target = e.target.closest('.drop-zone') || e.target.closest('.word-bank');
        if (target) target.classList.add('drag-over');
    }

    function drop(e) {
        e.preventDefault();
        // Remove hover styles
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));

        const id = e.dataTransfer.getData('text/plain');
        const draggable = document.getElementById(id);
        const target = e.target.closest('.drop-zone') || e.target.closest('.word-bank');

        if (!target || !draggable) return;

        // Constraint: Only allow dropping within the same exercise ID
        let targetExId;
        if (target.classList.contains('word-bank')) {
            targetExId = target.id.split('-')[1];
        } else {
            targetExId = target.dataset.ex;
        }

        if (draggable.dataset.origin != targetExId) return;

        // Logic for Drop Zone
        if (target.classList.contains('drop-zone')) {
            // Swap logic: if zone is occupied, return existing word to the bank
            if (target.children.length > 0) {
                const existingWord = target.children[0];
                document.getElementById(`bank-${targetExId}`).appendChild(existingWord);
            }
            target.appendChild(draggable);
            target.classList.remove('correct', 'incorrect');
        } 
        // Logic for returning to Word Bank
        else {
            target.appendChild(draggable);
        }
    }

    // Scoring Function
    function checkAllAnswers() {
        const dropZones = document.querySelectorAll('.drop-zone');
        let total = dropZones.length; // Should be 60
        let correct = 0;

        dropZones.forEach(zone => {
            const correctAnswer = zone.dataset.correct;
            // Clear previous grading
            zone.classList.remove('correct', 'incorrect');

            if (zone.children.length > 0) {
                const userWord = zone.children[0].dataset.val;
                if (userWord === correctAnswer) {
                    zone.classList.add('correct');
                    correct++;
                } else {
                    zone.classList.add('incorrect');
                }
            } else {
                zone.classList.add('incorrect');
            }
        });

        // Display Score
        const scoreDisplay = document.getElementById('score-display');
        scoreDisplay.innerHTML = `Kết quả: <span style="color:${correct === total ? '#27ae60' : '#c0392b'}">${correct} / ${total}</span> câu đúng`;
        
        if (correct === total) {
            scoreDisplay.innerHTML += " 🏆 Xuất sắc!";
        } else if (correct >= total * 0.8) {
            scoreDisplay.innerHTML += " 👍 Khá tốt!";
        }
    }

    // Run on load
    window.onload = init;

</script>

</body>
</html>
