    function renderQuiz() {
        const quizContent = document.getElementById('quizContent');
        
        quizData.forEach((item, index) => {
            if (item.type === "section") {
                const div = document.createElement('div');
                div.className = "section-title";
                div.innerText = item.title;
                quizContent.appendChild(div);
            } else if (item.type === "passage") {
                const div = document.createElement('div');
                div.className = "passage";
                div.innerHTML = item.text;
                quizContent.appendChild(div);
            } else {
                const div = document.createElement('div');
                div.className = "question-block";
                
                let html = `<div class="question-text">${item.question}</div>`;
                if(item.content) {
                    html += `<div class="question-content">${item.content}</div>`;
                }
                
                html += `<ul class="options">`;
                item.options.forEach((opt, i) => {
                    const labelId = `label-q${item.id}-${i}`;
                    const inputId = `q${item.id}-${i}`;
                    html += `
                        <li>
                            <label id="${labelId}">
                                <input type="radio" name="q${item.id}" id="${inputId}" value="${i}">
                                ${String.fromCharCode(65 + i)}. ${opt}
                            </label>
                        </li>
                    `;
                });
                html += `</ul>`;
                div.innerHTML = html;
                quizContent.appendChild(div);
            }
        });
    }

    function submitQuiz() {
        let score = 0;
        let totalQuestions = 0;
        
        // Disable nút nộp bài
        document.querySelector('.submit-btn').disabled = true;

        quizData.forEach(item => {
            if (item.id) {
                totalQuestions++;
                const selected = document.querySelector(`input[name="q${item.id}"]:checked`);
                const correctIndex = item.correct;
                
                // Highlight đáp án đúng
                const correctLabel = document.getElementById(`label-q${item.id}-${correctIndex}`);
                if (correctLabel) {
                    correctLabel.classList.add('correct-answer-label');
                    correctLabel.innerHTML += ` <span class="correct">✔ (Đáp án đúng)</span>`;
                }

                if (selected) {
                    const selectedIndex = parseInt(selected.value);
                    if (selectedIndex === correctIndex) {
                        score++;
                    } else {
                        // Highlight đáp án sai người dùng chọn
                        const wrongLabel = document.getElementById(`label-q${item.id}-${selectedIndex}`);
                        wrongLabel.classList.add('wrong-answer-label');
                        wrongLabel.innerHTML += ` <span class="incorrect">✘ (Bạn chọn)</span>`;
                    }
                }
            }
        });

        // Hiển thị kết quả
        const resultBox = document.getElementById('result');
        resultBox.style.display = 'block';
        resultBox.innerHTML = `Bạn đã trả lời đúng ${score} / ${totalQuestions} câu.`;
        resultBox.scrollIntoView({ behavior: 'smooth' });
    }

    // Khởi chạy khi load trang
    renderQuiz();
</script>
