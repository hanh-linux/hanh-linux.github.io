    function submitQuiz() {
        let score = 0;
        
        questions.forEach((q, idx) => {
            const selected = document.querySelector(`input[name="q${idx}"]:checked`);
            const resultBox = document.getElementById(`result-${idx}`);
            const card = document.getElementById(`card-${idx}`);
            
            // Hiện giải thích
            resultBox.style.display = "block";
            
            // Reset style cũ
            document.querySelectorAll(`#card-${idx} .options label`).forEach(lbl => {
                lbl.classList.remove('correct-bg', 'wrong-bg');
            });

            // Logic chấm điểm
            const correctId = `opt-${idx}-${q.ans}`;
            document.getElementById(correctId).parentElement.classList.add('correct-bg');

            if (selected) {
                const userVal = parseInt(selected.value);
                if (userVal === q.ans) {
                    score++;
                } else {
                    selected.parentElement.classList.add('wrong-bg');
                }
            }
        });

        // Hiển thị tổng điểm
        const scoreDisplay = document.getElementById('score-display');
        scoreDisplay.innerText = `Kết quả của bạn: ${score} / ${questions.length} câu đúng!`;
        scoreDisplay.style.display = 'block';
        scoreDisplay.scrollIntoView({ behavior: 'smooth' });

        // Disable nút nộp
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').innerText = "ĐÃ HOÀN THÀNH";
        document.getElementById('submit-btn').style.backgroundColor = "#7f8c8d";
    }

    // Render câu hỏi khi load trang
    window.onload = function() {
        const container = document.getElementById('quiz-container');
        let html = '';

        questions.forEach((q, idx) => {
            let badgeInfo = "";
            if(q.level === 'easy') badgeInfo = '<span class="q-tag tag-easy">Dễ</span>';
            if(q.level === 'medium') badgeInfo = '<span class="q-tag tag-medium">Trung Bình</span>';
            if(q.level === 'hard') badgeInfo = '<span class="q-tag tag-hard">Khó</span>';

            html += `
                <div class="question-card level-${q.level}" id="card-${idx}">
                    ${badgeInfo}
                    <div class="q-title">Câu ${idx+1}: ${q.q}</div>
                    <div style="margin-bottom:10px; font-style:italic; color:#7f8c8d;">Chủ đề: ${q.topic}</div>
                    
                    <pre>${q.code.replace(/</g, "&lt;")}</pre>
                    
                    <div class="options">
                        ${q.opts.map((opt, i) => `
                            <label>
                                <input type="radio" name="q${idx}" id="opt-${idx}-${i}" value="${i}">
                                ${opt.replace(/</g, "&lt;")}
                            </label>
                        `).join('')}
                    </div>

                    <div class="result-box" id="result-${idx}">
                        <strong>Giải thích:</strong> ${q.expl}
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    };
</script>
