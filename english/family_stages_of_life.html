<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Practice: Family & Stages of Life</title>
    <style>
        :root {
            --primary: #c0392b; /* Màu đỏ ấm cho chủ đề gia đình */
            --accent: #e67e22; 
            --secondary: #d35400;
            --light: #fdf2e9;
            --correct: #27ae60;
            --incorrect: #c0392b;
            --font-stack: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-stack);
            background-color: #fff5f0;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 4px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            font-size: 2.2em;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1em;
            color: #7f8c8d;
        }

        /* Exercise Card */
        .exercise-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 50px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        .card-header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h3 {
            margin: 0;
            font-size: 1.2em;
            font-weight: 600;
        }

        .topic-badge {
            background-color: var(--accent);
            color: white;
            font-size: 0.85em;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .card-body {
            padding: 25px;
        }

        /* Word Bank */
        .word-bank {
            background-color: var(--light);
            border: 2px dashed #e59866;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 60px;
        }

        .draggable {
            background: white;
            border: 1px solid #e59866;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: grab;
            font-weight: 600;
            font-size: 0.95em;
            color: var(--primary);
            box-shadow: 0 2px 2px rgba(0,0,0,0.05);
            transition: all 0.2s;
            user-select: none;
        }

        .draggable:hover {
            border-color: var(--secondary);
            color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .draggable.dragging {
            opacity: 0.5;
            background: #dfe6e9;
        }

        /* Paragraph Content */
        .text-content {
            font-size: 1.1em;
            line-height: 2.5; /* High line-height for drop zones */
            text-align: justify;
        }

        .drop-zone {
            display: inline-flex;
            min-width: 140px;
            height: 34px;
            border-bottom: 2px solid #95a5a6;
            background-color: #f4f6f7;
            margin: 0 5px;
            vertical-align: middle;
            align-items: center;
            justify-content: center;
            border-radius: 4px 4px 0 0;
            transition: all 0.3s;
            position: relative;
            top: 4px;
            padding: 0 10px;
        }

        .drop-zone.drag-over {
            background-color: #fad7a0;
            border-bottom-color: var(--secondary);
        }

        .drop-zone .draggable {
            margin: 0;
            border: none;
            background: transparent;
            box-shadow: none;
            padding: 0;
            width: 100%;
            text-align: center;
            cursor: grab;
        }

        /* Results */
        .drop-zone.correct {
            border-bottom: 3px solid var(--correct);
            background-color: #e9f7ef;
            color: var(--correct);
            font-weight: bold;
        }

        .drop-zone.incorrect {
            border-bottom: 3px solid var(--incorrect);
            background-color: #fdedec;
            color: var(--incorrect);
            font-weight: bold;
        }

        /* Footer Controls */
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            border-top: 1px solid #eee;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }

        #submit-btn {
            background-color: var(--correct);
            color: white;
        }
        #submit-btn:hover { background-color: #219150; }

        #reset-btn {
            background-color: #95a5a6;
            color: white;
        }
        #reset-btn:hover { background-color: #7f8c8d; }

        #score-display {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
            margin-left: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Family & Stages of Life</h1>
        <p class="subtitle">Theme 1 Vocabulary Practice (Drag and Drop)</p>
    </header>

    <div id="exercises-wrapper"></div>
</div>

<div class="footer-bar">
    <button id="submit-btn" onclick="checkAll()">Nộp Bài</button>
    <button id="reset-btn" onclick="location.reload()">Làm Lại</button>
    <div id="score-display"></div>
</div>

<script>
    // Dữ liệu 10 bài tập được biên soạn từ file từ vựng Theme 1
    const exercisesData = [
        {
            id: 1,
            title: "Stages of Human Growth",
            topic: "Life Stages",
            text: "Life is a journey through different phases. It begins with <strong>[1]</strong>, a time of innocence and play. As children grow, they enter <strong>[2]</strong>, a period often marked by physical changes known as <strong>[3]</strong>. This transition can be challenging as they seek more freedom. Eventually, they reach <strong>[4]</strong>, where they must accept full responsibility for their actions. Many people then choose to <strong>[5]</strong>, get married, and start their own families. Throughout this process, they gain greater <strong>[6]</strong> from their parents.",
            answers: ["childhood", "adolescence", "puberty", "adulthood", "settle down", "independence"],
            distractors: ["abortion", "crisis", "microcosm", "ties", "domestic", "striking"]
        },
        {
            id: 2,
            title: "Family Structures",
            topic: "Types of Family",
            text: "Families come in many shapes and sizes. An <strong>[1]</strong> family consists only of parents and their children living together. However, many people live in an <strong>[2]</strong> family, which includes grandparents, aunts, and uncles. It is wonderful when relatives live close by and maintain a <strong>[3]</strong> relationship, supporting each other. A family gathering is a great chance for every <strong>[4]</strong>, from the youngest to the oldest, to connect. A strong <strong>[5]</strong> between members creates a sense of belonging. Every <strong>[6]</strong> is important in this social network.",
            answers: ["immediate", "extended", "close-knit", "generation", "bond", "relative"],
            distractors: ["conflict", "rivalry", "instinct", "temperament", "active role", "rewarding"]
        },
        {
            id: 3,
            title: "Raising Children",
            topic: "Parenting",
            text: "Being a parent is a difficult but rewarding job. Your <strong>[1]</strong> involves not just feeding a child, but teaching them values. It is important to <strong>[2]</strong> children with love and care so they develop well. However, parents should be careful not to <strong>[3]</strong> them by giving them everything they want, as this can lead to bad behavior. Good <strong>[4]</strong> guidance helps children distinguish right from wrong. A <strong>[5]</strong> home environment provides the security children need. Parents must <strong>[6]</strong> their children to be responsible citizens.",
            answers: ["upbringing", "nurture", "spoil", "parental", "stable", "bring up"],
            distractors: ["inherit", "negotiate", "accommodate", "endure", "fly the nest", "break down"]
        },
        {
            id: 4,
            title: "Sibling Dynamics",
            topic: "Siblings",
            text: "Growing up with a brother or sister is a unique experience. A <strong>[1]</strong> is someone who shares your history and DNA. Often, there is some <strong>[2]</strong> as children compete for their parents' attention. Despite the fights, there is usually a deep <strong>[3]</strong> of love underneath. Siblings learn to <strong>[4]</strong> toys and secrets, which teaches them cooperation. Positive <strong>[5]</strong> between brothers and sisters helps them develop social skills. They often show <strong>[6]</strong> for each other during difficult times.",
            answers: ["sibling", "rivalry", "bond", "share", "interaction", "affection"],
            distractors: ["custody", "abortion", "cohabitation", "engagement", "crisis", "dependence"]
        },
        {
            id: 5,
            title: "Romantic Relationships",
            topic: "Relationships",
            text: "Finding a partner is a major life step. Before marriage, a couple might announce their <strong>[1]</strong> to friends and family. Some couples choose <strong>[2]</strong>, living together before making it official. When they decide to <strong>[3]</strong>, they commit to a life together. To make it work, they often have to <strong>[4]</strong> when they disagree. Sadly, if communication fails, the relationship may <strong>[5]</strong>. However, with effort, they can establish a lasting <strong>[6]</strong>.",
            answers: ["engagement", "cohabitation", "get married", "compromise", "break down", "connection"],
            distractors: ["adoption", "adolescence", "puberty", "childhood", "brotherhood", "instinct"]
        },
        {
            id: 6,
            title: "Challenges in Family Life",
            topic: "Conflict",
            text: "No family is perfect, and problems do arise. A <strong>[1]</strong> can occur when parents and teenagers disagree on rules. Teenagers often become <strong>[2]</strong>, refusing to obey instructions. This can lead to a family <strong>[3]</strong> where everyone is stressed. Individual <strong>[4]</strong> plays a role; some people get angry easily while others remain calm. <strong>[5]</strong> violence is a serious issue that harms everyone in the home. In such <strong>[6]</strong> times, outside help might be needed.",
            answers: ["conflict", "rebellious", "crisis", "temperament", "domestic", "troubled"],
            distractors: ["stable", "loving", "rewarding", "grateful", "respectable", "active role"]
        },
        {
            id: 7,
            title: "Inheritance and Nature",
            topic: "Genetics",
            text: "We often look like our family members. There is often a <strong>[1]</strong> resemblance between a father and son. Children <strong>[2]</strong> physical traits like eye color from their parents. However, a person's <strong>[3]</strong> and personality are also influenced by their environment. It is human <strong>[4]</strong> to protect one's family. A mother's <strong>[5]</strong> to care for her child is very powerful. Each person has a unique <strong>[6]</strong> that makes them who they are.",
            answers: ["striking", "inherit", "nature", "instinct", "affection", "character"],
            // Note: 'affection' is a noun, 'maternal' is adj. 
            // Let's swap 'affection' with 'instinct' contextually or use 'maternal' if fitting. 
            // "A mother's [instinct]..." fits well. "Human [nature]..." fits well.
            // Let's adjust answers based on list.
            answers: ["striking", "inherit", "character", "nature", "instinct", "resemblance"],
            distractors: ["duty", "balance", "connection", "interaction", "intimacy", "microcosm"]
        },
        {
            id: 8,
            title: "Becoming Independent",
            topic: "Leaving Home",
            text: "Leaving home is a big step for young adults. When children <strong>[1]</strong>, they move out to live on their own. This marks the start of true <strong>[2]</strong> from their parents. They must learn to take <strong>[3]</strong> for their own finances and decisions. Financial <strong>[4]</strong> on parents usually decreases over time. It is a time to <strong>[5]</strong> a career and a new life. Most children feel <strong>[6]</strong> to their parents for the support given over the years.",
            answers: ["fly the nest", "independence", "responsibility", "dependence", "establish", "grateful"],
            distractors: ["neglect", "abuse", "spoil", "troubled", "crisis", "conflict"]
        },
        {
            id: 9,
            title: "Aging and Care",
            topic: "Old Age",
            text: "<strong>[1]</strong> is a natural part of life that everyone faces. As parents get older, it is often the children's <strong>[2]</strong> to look after them. We should <strong>[3]</strong> the elderly for their wisdom and experience. Sometimes, caring for a sick relative requires us to <strong>[4]</strong> difficult situations. However, many find this role to be <strong>[5]</strong> because it gives back to those who raised them. We must <strong>[6]</strong> care of our elders with patience and love.",
            answers: ["aging", "duty", "respect", "endure", "rewarding", "take"],
            distractors: ["puberty", "adolescence", "infancy", "toddler", "birth", "abortion"]
        },
        {
            id: 10,
            title: "Social Connections",
            topic: "Social Life",
            text: "Humans are social beings who need others. We rely on social <strong>[1]</strong> to feel connected to the world. Having <strong>[2]</strong> for friends going through hard times strengthens friendships. A <strong>[3]</strong> understanding between two people builds trust. Strong <strong>[4]</strong> with the community are also important for mental health. We should try to <strong>[5]</strong> the needs of others when possible. Building a good <strong>[6]</strong> with colleagues makes work more enjoyable.",
            answers: ["interaction", "sympathy", "mutual", "ties", "accommodate", "rapport"],
            distractors: ["break down", "split", "divorce", "conflict", "fight", "rivalry"]
        }
    ];

    // Hàm trộn mảng (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Khởi tạo bài tập
    function init() {
        const wrapper = document.getElementById('exercises-wrapper');

        exercisesData.forEach((ex, index) => {
            // Tạo thẻ Card
            const card = document.createElement('div');
            card.classList.add('exercise-card');

            // Header
            const header = document.createElement('div');
            header.classList.add('card-header');
            header.innerHTML = `
                <h3>${index + 1}. ${ex.title}</h3>
                <span class="topic-badge">${ex.topic}</span>
            `;
            card.appendChild(header);

            // Body
            const body = document.createElement('div');
            body.classList.add('card-body');

            // Word Bank
            const bank = document.createElement('div');
            bank.classList.add('word-bank');
            bank.id = `bank-${ex.id}`;

            // Gộp đáp án đúng và từ nhiễu, sau đó trộn
            const allWords = shuffle([...ex.answers, ...ex.distractors]);
            
            allWords.forEach(word => {
                const span = document.createElement('span');
                span.classList.add('draggable');
                span.setAttribute('draggable', 'true');
                span.textContent = word;
                span.id = `word-${ex.id}-${word.replace(/\s+/g, '-')}`;
                span.dataset.word = word;
                span.dataset.origin = ex.id; // Để kiểm tra nguồn gốc tránh kéo nhầm bài

                // Events Drag
                span.addEventListener('dragstart', dragStart);
                span.addEventListener('dragend', dragEnd);

                bank.appendChild(span);
            });
            body.appendChild(bank);

            // Đoạn văn
            const p = document.createElement('div');
            p.classList.add('text-content');
            
            // Thay thế [1]..[6] bằng ô drop-zone
            let formattedText = ex.text;
            ex.answers.forEach((ans, i) => {
                const placeholder = `<strong>[${i + 1}]</strong>`;
                const zone = `<span class="drop-zone" data-correct="${ans}" data-ex="${ex.id}"></span>`;
                formattedText = formattedText.replace(placeholder, zone);
            });
            
            p.innerHTML = formattedText;
            body.appendChild(p);
            
            card.appendChild(body);
            wrapper.appendChild(card);
        });

        // Gán sự kiện Drop cho toàn bộ zone và bank
        document.querySelectorAll('.drop-zone, .word-bank').forEach(el => {
            el.addEventListener('dragover', dragOver);
            el.addEventListener('drop', drop);
        });
    }

    // Drag & Drop Functions
    function dragStart(e) {
        e.dataTransfer.setData('text/plain', e.target.id);
        setTimeout(() => e.target.classList.add('dragging'), 0);
    }

    function dragEnd(e) {
        e.target.classList.remove('dragging');
    }

    function dragOver(e) {
        e.preventDefault();
        const target = e.target.closest('.drop-zone') || e.target.closest('.word-bank');
        if (target) target.classList.add('drag-over');
    }

    function drop(e) {
        e.preventDefault();
        // Xóa hiệu ứng hover
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));

        const id = e.dataTransfer.getData('text/plain');
        const draggable = document.getElementById(id);
        const target = e.target.closest('.drop-zone') || e.target.closest('.word-bank');

        if (!target || !draggable) return;

        // Logic: Chỉ cho phép thả trong cùng 1 bài tập (dựa trên ID bài tập)
        let targetExId;
        if (target.classList.contains('word-bank')) {
            targetExId = target.id.split('-')[1];
        } else {
            targetExId = target.dataset.ex;
        }

        // Nếu từ vựng không thuộc bài tập này -> Chặn
        if (draggable.dataset.origin != targetExId) return;

        // Xử lý thả vào ô trống
        if (target.classList.contains('drop-zone')) {
            // Nếu ô đã có từ -> Trả từ cũ về bank của bài tập đó
            if (target.children.length > 0) {
                const oldChild = target.children[0];
                document.getElementById(`bank-${targetExId}`).appendChild(oldChild);
            }
            target.appendChild(draggable);
            target.classList.remove('correct', 'incorrect');
        } 
        // Xử lý thả về bank
        else {
            target.appendChild(draggable);
        }
    }

    // Kiểm tra đáp án
    function checkAll() {
        const zones = document.querySelectorAll('.drop-zone');
        let total = zones.length;
        let correct = 0;

        zones.forEach(zone => {
            const correctAnswer = zone.dataset.correct;
            // Reset style
            zone.classList.remove('correct', 'incorrect');

            if (zone.children.length > 0) {
                const userWord = zone.children[0].dataset.word;
                if (userWord === correctAnswer) {
                    zone.classList.add('correct');
                    correct++;
                } else {
                    zone.classList.add('incorrect');
                }
            } else {
                zone.classList.add('incorrect');
            }
        });

        const display = document.getElementById('score-display');
        display.innerHTML = `Kết quả: <span style="color:${correct === total ? '#27ae60' : '#c0392b'}">${correct} / ${total}</span> câu đúng`;
        
        if (correct === total) {
            display.innerHTML += " - Tuyệt vời!";
        }
    }

    // Chạy khi tải trang
    window.onload = init;

</script>

</body>
</html>
